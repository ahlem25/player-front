<div class="container">
    <div class="header">
        <h2>{{ isEditMode ? 'Modifier un joueur' : 'Ajouter un joueur' }}</h2>
        <button class="btn btn-secondary" (click)="goBack()">Retour</button>
    </div>

    <div class="alert alert-danger" *ngIf="errorMessage">
        {{ errorMessage }}
    </div>

    <form [formGroup]="playerForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
            <label for="firstName">Prénom</label>
            <input type="text" id="firstName" formControlName="firstName" class="form-control"
                [ngClass]="{'is-invalid': f['firstName'].touched && f['firstName'].errors}">
            <div class="invalid-feedback" *ngIf="f['firstName'].touched && f['firstName'].errors">
                <span *ngIf="f['firstName'].errors['required']">Le prénom est obligatoire</span>
            </div>
        </div>

        <div class="form-group">
            <label for="lastName">Nom</label>
            <input type="text" id="lastName" formControlName="lastName" class="form-control"
                [ngClass]="{'is-invalid': f['lastName'].touched && f['lastName'].errors}">
            <div class="invalid-feedback" *ngIf="f['lastName'].touched && f['lastName'].errors">
                <span *ngIf="f['lastName'].errors['required']">Le nom est obligatoire</span>
            </div>
        </div>

        <div class="form-group">
            <label for="position">Position</label>
            <select id="position" formControlName="position" class="form-control"
                [ngClass]="{'is-invalid': f['position'].touched && f['position'].errors}">
                <option value="">Sélectionner une position</option>
                <option value="Attaquant">Attaquant</option>
                <option value="Défenseur">Défenseur</option>
                <option value="Gardien">Gardien</option>
                <option value="Milieu">Milieu</option>
            </select>
            <div class="invalid-feedback" *ngIf="f['position'].touched && f['position'].errors">
                <span *ngIf="f['position'].errors['required']">La position est obligatoire</span>
            </div>
        </div>

        <div class="form-group">
            <label for="team">Équipe</label>
            <input type="text" id="team" formControlName="team" class="form-control"
                [ngClass]="{'is-invalid': f['team'].touched && f['team'].errors}">
            <div class="invalid-feedback" *ngIf="f['team'].touched && f['team'].errors">
                <span *ngIf="f['team'].errors['required']">L'équipe est obligatoire</span>
            </div>
        </div>

        <div class="form-group">
            <label for="age">Âge</label>
            <input type="number" id="age" formControlName="age" class="form-control"
                [ngClass]="{'is-invalid': f['age'].touched && f['age'].errors}">
            <div class="invalid-feedback" *ngIf="f['age'].touched && f['age'].errors">
                <span *ngIf="f['age'].errors['required']">L'âge est obligatoire</span>
                <span *ngIf="f['age'].errors['min']">L'âge doit être au moins de 16 ans</span>
                <span *ngIf="f['age'].errors['max']">L'âge doit être au maximum de 50 ans</span>
            </div>
        </div>

        <div class="form-group">
            <button type="submit" class="btn btn-primary" [disabled]="playerForm.invalid || isSubmitting">
                <span *ngIf="isSubmitting">Enregistrement en cours...</span>
                <span *ngIf="!isSubmitting">{{ isEditMode ? 'Mettre à jour' : 'Enregistrer' }}</span>
            </button>
        </div>
    </form>
</div>
