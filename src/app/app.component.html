
<div class="app-container">
  <header *ngIf="isLoggedIn">
    <nav class="navbar">
      <div class="container">
        <div class="navbar-brand">
          <a [routerLink]="['/players']">Gestion des joueurs de football</a>
        </div>
        <div class="navbar-menu">
          <ul>
            <li><a [routerLink]="['/players']" routerLinkActive="active">Joueurs</a></li>
            <li><a [routerLink]="['/players/new']" routerLinkActive="active">Ajouter</a></li>
            <li><a [routerLink]="['/players/import']" routerLinkActive="active">Importer</a></li>
            <li><a href="javascript:void(0)" (click)="logout()">Déconnexion</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <div class="container">
      <router-outlet></router-outlet>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2024 Gestion des joueurs de football</p>
    </div>
  </footer>
</div>
